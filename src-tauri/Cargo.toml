[package]
name = "agent-grid"
version = "0.3.0"
description = "Independent terminal workspace for local coding agents"
authors = ["Agent Grid contributors"]
license = "MIT"
edition = "2021"
default-run = "agent-grid"

[[bin]]
name = "agent-grid"
path = "src/main.rs"

[[bin]]
name = "agent-grid-helper"
path = "src/helper_main.rs"
test = false

[lib]
name = "agent_grid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.28"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
